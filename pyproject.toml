[project]
name = "business-insights-copilot"
version = "0.1.0"
description = "LLM-powered AI Business Insights Copilot (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.1",
  "pyyaml>=6.0.1",
  "sqlglot>=23.0.0",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "tenacity>=8.2.3",
  "langgraph>=0.2.20",
  "langsmith>=0.2.0",
  "openai>=1.30.0",
  "faiss-cpu>=1.7.4",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.1"
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000

[tool.ruff]
line-length = 110
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "RUF"]

[tool.ruff.lint]
extend-ignore = []

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

